[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-governance"
version = "1.0.0"
description = "AURA - AI Unified Review Assistant: MCP-native AI review governance and orchestration platform for customer-call transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AURA Engineering Team" }
]
dependencies = [
    "mcp>=2.0.0,<2.1.0",
    "streamlit>=1.38.0,<2.0.0",
    "pandas>=2.2.0,<4.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
